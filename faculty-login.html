<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty Login | Joy University</title><link rel="stylesheet" href="/public.css"></head><body><header class="site-header"><a class="wordmark" href="/">JOY UNIVERSITY</a><nav><a href="/timetable.html">Public timetable</a><a href="/demo.html">One-click demo</a></nav></header><main class="login-shell"><form class="login-card" id="f"><h1>Faculty sign in</h1><p>Only the two authorized timetable coordinators of each school can sign in.</p><label>University email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="button" id="go">Sign in</button><div id="err" class="login-error"></div></form></main><script src="/auth.js"></script><script>(function(){var f=document.getElementById("f"),b=document.getElementById("go"),e=document.getElementById("err");USAuth.getRole().then(function(r){if(r&&r.authenticated)location.replace("/workspace.html")}).catch(function(){});f.onsubmit=async function(x){x.preventDefault();b.disabled=true;try{await USAuth.signIn(document.getElementById("email").value.trim(),document.getElementById("password").value);location.replace("/workspace.html")}catch(z){e.textContent=z.message||"Sign-in failed"}finally{b.disabled=false}}})();</script></body></html>
